<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tag {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    /* CSS Animations for Dynamic Edge Nodes */
    @keyframes pulse {
      0% { r: 6px; opacity: 0.4; }
      50% { r: 12px; opacity: 0.9; }
      100% { r: 6px; opacity: 0.4; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-10px) translateX(5px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes dashSignal {
      to { stroke-dashoffset: -40; }
    }

    .pulse-node { animation: pulse 3s infinite ease-in-out; }
    .pulse-node-delayed { animation: pulse 3s infinite ease-in-out; animation-delay: 1.5s; }
    .particle { animation: floatParticle 4s infinite ease-in-out; }
    .signal-line {
      stroke-dasharray: 6 8;
      animation: dashSignal 2s linear infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- DYNAMIC BACKGROUND ARCHITECTURE (Network Lines & Nodes in Back) -->
  <g opacity="0.35">
    <!-- Cloud Center Node -->
    <circle cx="980" cy="170" r="45" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="980" cy="170" r="25" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" />

    <!-- Edge Device Nodes -->
    <!-- Node 1 -->
    <line x1="980" y1="170" x2="800" y2="80" stroke="#38bdf8" stroke-width="1.5" class="signal-line" />
    <circle cx="800" cy="80" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="800" cy="80" r="6" fill="#38bdf8" class="pulse-node" />

    <!-- Node 2 -->
    <line x1="980" y1="170" x2="840" y2="250" stroke="#8b5cf6" stroke-width="1.5" class="signal-line" />
    <circle cx="840" cy="250" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <circle cx="840" cy="250" r="6" fill="#a855f7" class="pulse-node-delayed" />

    <!-- Node 3 -->
    <line x1="980" y1="170" x2="1100" y2="90" stroke="#06b6d4" stroke-width="1.5" class="signal-line" />
    <circle cx="1100" cy="90" r="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <circle cx="1100" cy="90" r="5" fill="#06b6d4" class="pulse-node" />

    <!-- Node 4 -->
    <line x1="980" y1="170" x2="1110" y2="260" stroke="#ec4899" stroke-width="1.5" class="signal-line" />
    <circle cx="1110" cy="260" r="15" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <circle cx="1110" cy="260" r="6" fill="#ec4899" class="pulse-node-delayed" />

    <!-- Inter-edge Mesh links -->
    <line x1="800" y1="80" x2="840" y2="250" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="1100" y1="90" x2="1110" y2="260" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Floating Data Particles -->
    <circle cx="750" cy="140" r="3" fill="#38bdf8" class="particle" />
    <circle cx="900" cy="110" r="4" fill="#a855f7" class="particle" />
    <circle cx="1040" cy="210" r="3" fill="#06b6d4" class="particle" />
  </g>

  <!-- Subtle Geometric Grid Overlay -->
  <g opacity="0.08">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M200 0 V340 M400 0 V340 M600 0 V340 M800 0 V340 M1000 0 V340" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Unobscured & Readable) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Tag -->
    <rect x="0" y="55" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="73" class="tag">⚡ AWESOME EDGE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Edge Device Orchestration 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">A curated list of Edge Orchestration, Fleet Management &amp; OTA Platforms</text>

    <!-- Key Feature Badges / Highlights inside Banner -->
    <g transform="translate(0, 230)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="34" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Fleet Management</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="200" cy="17" r="5" fill="#06b6d4" />
      <text x="214" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">OTA Updates</text>

      <!-- Badge 3 -->
      <rect x="345" y="0" width="185" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="365" cy="17" r="5" fill="#8b5cf6" />
      <text x="379" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Edge Workloads</text>
    </g>
  </g>
</svg>
